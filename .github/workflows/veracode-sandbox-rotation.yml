name: Veracode Sandbox Rotation & Scan

on:
  workflow_dispatch:
    inputs:
      sandbox_name:
        description: 'Nome da Sandbox (deixe vazio para usar o nome da branch atual)'
        required: false
        type: string

env:
  APP_NAME: "Github - ${{ github.repository }}"
  SANDBOX_THRESHOLD: 9 # Promove a mais antiga se já existirem 9 ou mais sandboxes (limite = 10)
  PACKAGE_PATH: "veracode.zip"
  TARGET_SANDBOX: ${{ inputs.sandbox_name || github.ref_name }}

jobs:
  veracode-sandbox-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Preparar pacote Veracode (ZIP otimizado)
        run: |
          zip -r "${{ env.PACKAGE_PATH }}" . -i '*.py' '*.html' '*.htm' '*.asp' '*.cjs' '*.css' '*.ehtml' '*.es' '*.es6' '*.handlebars' '*.hbs' '*.hjs' '*.js' '*.jsx' '*.json' '*.jsp' '*.jspx' '*.java' '*.map' '*.mjs' '*.mustache' '*.ts' '*.tsx' '*.vue' '*.xhtml' '*.lock' '*.module' '*.inc' '*.profile' '*.install' '*.engine' '*.theme' '*.php' '*.php4' '*.php5' '*.php7' '*.phtml' '*.txt' 'pyproject.toml' 'Pipfile' 'Pipfile.lock' 'composer.lock' '*.cs' '*.cshtml' '*.razor' '*.csproj' '*.sln' '*.slnx' '*.props' '*.targets' '*.config' '*.deps.json' '*.asset.json' '*.cob' '*.cbl' '*.cobol' '*.pco' '*.cpy' '*.cls' '*.trg' '*.tgr' '*.trigger' '*.pks' '*.pkb' '*.vfp' '*.cmp' '*.component' '*.evt' '*.app' '*.page' '*.fnc' '*.pck' '*.pls' '*.prc' '*.sql' '*.tpb' '*.tps' '*.vw' '*.bas' '*.frm' '*.frx' '*.ctl' '*.ctx' '*.vbp' '*.vbg' '*.vb' '*.vbs' '*.asa' '*.grp' '*.ocx' '*.rpg' '*.rpg4' '*.rpgle' '*.pf' '*.lf' '*.dspf' '*.prt' '*.icf' '*.sc' '*.scala' '*.groovy' '*.gvy' '*.gy' '*.gsh' '*.pl' '*.pm' '*.plx' '*.pl5' '*.cgi' '*.go' 'go.mod' 'go.sum' 'veracode.json' -x 'node_modules/*' '*/node_modules/*' '.git/*' '*/.git/*' 'dist/*' '*/dist/*' 'bin/*' '*/bin/*' 'obj/*' '*/obj/*' 'packages/*' '*/packages/*' '.vscode/*' '*/.vscode/*' '.idea/*' '*/.idea/*' '*/test/*' '*/tests/*' '*/__tests__/*' '*_test.*' '*_spec.*' '*Test.*' '*Tests.*'
          ls -lh "${{ env.PACKAGE_PATH }}"

      - name: Garantir existência do Application Profile
        id: ensure_profile
        env:
          VERACODE_API_KEY_ID: ${{ secrets.VERACODEID }}
          VERACODE_API_KEY_SECRET: ${{ secrets.VERACODEKEY }}
        run: |
          pip install requests veracode-api-signing -q
          python3 - << 'EOF'
          import os
          import sys
          import requests
          from veracode_api_signing.plugin_requests import RequestsAuthPluginVeracodeHMAC

          # Validação rápida para evitar 401 silencioso por secret vazio/não herdado
          vid = os.environ.get("VERACODE_API_KEY_ID", "").strip()
          vkey = os.environ.get("VERACODE_API_KEY_SECRET", "").strip()
          if not vid or not vkey:
              print("ERRO: Secrets VERACODEID ou VERACODEKEY estão vazios ou inacessíveis neste repositório.", file=sys.stderr)
              sys.exit(1)

          os.environ["VERACODE_API_KEY_ID"] = vid
          os.environ["VERACODE_API_KEY_SECRET"] = vkey

          app_name = os.environ["APP_NAME"]
          base_url = "https://api.veracode.com/appsec/v1"
          auth = RequestsAuthPluginVeracodeHMAC()

          # 1. Consultar se o Application Profile já existe
          resp = requests.get(f"{base_url}/applications", params={"name": app_name}, auth=auth)
          if resp.status_code == 401:
              print("ERRO 401 Unauthorized: Verifique se o VERACODEID/VERACODEKEY da organização não expirou ou se a região da conta é EU/US.", file=sys.stderr)
              sys.exit(1)
          resp.raise_for_status()

          apps = resp.json().get("_embedded", {}).get("applications", [])
          target_app = next((a for a in apps if a["profile"]["name"] == app_name), None)

          # 2. Se não existir, cria o Application Profile explicitamente
          if not target_app:
              print(f"Perfil '{app_name}' não encontrado. Criando Application Profile na Veracode...")
              payload = {
                  "profile": {
                      "name": app_name,
                      "business_criticality": "VERY_HIGH"
                  }
              }
              create_resp = requests.post(f"{base_url}/applications", json=payload, auth=auth)
              create_resp.raise_for_status()
              target_app = create_resp.json()
              print(f"Perfil '{app_name}' criado com sucesso!")
          else:
              print(f"Perfil '{app_name}' já existe.")

          app_guid = target_app["guid"]
          print(f"GUID do perfil: {app_guid}")

          # Exporta o GUID para o próximo step via GITHUB_OUTPUT
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"app_guid={app_guid}\n")
          EOF

      - name: Verificar limite de Sandboxes e promover a mais antiga
        env:
          VERACODE_API_KEY_ID: ${{ secrets.VERACODEID }}
          VERACODE_API_KEY_SECRET: ${{ secrets.VERACODEKEY }}
          APP_GUID: ${{ steps.ensure_profile.outputs.app_guid }}
        run: |
          python3 - << 'EOF'
          import os
          import sys
          import requests
          from veracode_api_signing.plugin_requests import RequestsAuthPluginVeracodeHMAC

          os.environ["VERACODE_API_KEY_ID"] = os.environ["VERACODE_API_KEY_ID"].strip()
          os.environ["VERACODE_API_KEY_SECRET"] = os.environ["VERACODE_API_KEY_SECRET"].strip()

          app_name = os.environ["APP_NAME"]
          app_guid = os.environ["APP_GUID"]
          threshold = int(os.environ.get("SANDBOX_THRESHOLD", 9))
          target_sandbox = os.environ["TARGET_SANDBOX"]
          base_url = "https://api.veracode.com/appsec/v1"
          auth = RequestsAuthPluginVeracodeHMAC()

          # 1. Listar todas as Sandboxes do perfil usando o GUID obtido na etapa anterior
          sb_resp = requests.get(f"{base_url}/applications/{app_guid}/sandboxes", auth=auth)
          sb_resp.raise_for_status()
          sandboxes = sb_resp.json().get("_embedded", {}).get("sandboxes", [])

          total_sb = len(sandboxes)
          print(f"Perfil '{app_name}' | Total de sandboxes ativas: {total_sb}/10")

          # Verifica se a sandbox alvo já existe (não consome novo slot)
          if any(s["name"] == target_sandbox for s in sandboxes):
              print(f"A sandbox '{target_sandbox}' já existe. Nenhum slot novo será consumido.")
              sys.exit(0)

          if total_sb < threshold:
              print("Dentro do limite seguro. Nenhuma promoção necessária.")
              sys.exit(0)

          # 2. Ordenar da mais antiga para a mais recente
          sandboxes_sorted = sorted(sandboxes, key=lambda s: s.get("modified", s.get("created", "")))
          oldest = sandboxes_sorted[0]
          oldest_id = str(oldest["id"])
          oldest_name = oldest["name"]
          oldest_date = oldest.get("modified", oldest.get("created"))

          print(f"Limite próximo ({total_sb}/{threshold}). Promovendo sandbox mais antiga: '{oldest_name}' (ID: {oldest_id}, Última modificação: {oldest_date})")

          # 3. Promover a sandbox mais antiga diretamente via API da Veracode
          promote_resp = requests.post(
              "https://analysiscenter.veracode.com/api/5.0/promotesandbox.do",
              params={"sandbox_id": oldest_id},
              auth=auth
          )
          promote_resp.raise_for_status()
          print(promote_resp.text)

          if "<error>" in promote_resp.text:
              print("Erro retornado pela API da Veracode ao promover sandbox.", file=sys.stderr)
              sys.exit(1)

          print(f"Sandbox '{oldest_name}' promovida com sucesso! Slot liberado.")
          EOF

      - name: UploadAndScan SBs
        uses: veracode/veracode-uploadandscan-action@master
        with:
          vid: ${{ secrets.VERACODEID }}
          vkey: ${{ secrets.VERACODEKEY }}
          appname: ${{ env.APP_NAME }}
          createprofile: true
          criticality: 'VeryHigh'
          createsandbox: true
          sandboxname: ${{ env.TARGET_SANDBOX }}
          filepath: ${{ env.PACKAGE_PATH }}
          deleteincompletescan: 0
          version: ${{ github.run_id }}